PACKAGE_NAME="arctic-fan-controller"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="arctic_fan_controller"
DEST_MODULE_LOCATION[0]="/extra/dkms"
AUTOINSTALL="yes"

# Rebuild automatically whenever a kernel package is installed.
# The Makefile's dkms-build target compiles in place (BUILD=.) and re-runs the
# header probes, so a new kernel that gains the APIs upstream simply drops the
# compat flags it no longer needs.
MAKE[0]="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build dkms-build KDIR=${kernel_source_dir}"
CLEAN="make -C ${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean BUILD=."

# The driver needs USB HID + hwmon; both are built as modules in every distro.
BUILD_EXCLUSIVE_KERNEL_MIN="5.10"
